<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#006948" />
    <title>KasirKita Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,460px);border:1px solid #d7e2dc;border-radius:28px;background:#fff;padding:32px;text-align:center;box-shadow:0 24px 70px rgba(15,23,42,.12)}img{width:76px;height:76px;object-fit:contain}.badge{display:inline-flex;margin-top:18px;border-radius:999px;background:#ecfdf5;color:#006948;padding:8px 14px;font-size:13px;font-weight:800}h1{margin:18px 0 8px;font-size:28px}p{margin:0;color:#64748b;line-height:1.6}.action{display:block;margin-top:24px;border-radius:14px;background:#006948;color:#fff;padding:14px 18px;text-decoration:none;font-weight:800}.hint{margin-top:16px;font-size:12px}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/kasirkita-mark.png" alt="KasirKita" />
      <div class="badge">MODE OFFLINE</div>
      <h1>KasirKita tetap siap</h1>
      <p>Hubungkan internet satu kali dan buka POS agar data serta tampilan kasir tersimpan di perangkat ini.</p>
      <a class="action" href="/admin/pos">Buka POS Kasir</a>
      <p class="hint">Transaksi tunai, QRIS statis, dan hutang akan disinkronkan saat internet kembali.</p>
    </main>
  </body>
</html>
